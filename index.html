<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本 都道府県・市区町村 人口・年齢ヒートマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>

  <div id="controls">
    <div id="control-header">
      <h2>日本地図</h2>
      <span id="zoom-level"></span>
    </div>

    <div class="control-group">
      <label>表示データ</label>
      <div class="btn-group">
        <button class="btn active" data-mode="population">人口</button>
        <button class="btn" data-mode="avg_age">平均年齢</button>
        <button class="btn" data-mode="elderly_pct">高齢化率</button>
      </div>
    </div>

    <div id="legend">
      <div id="legend-title"></div>
      <div id="legend-bar"></div>
      <div id="legend-labels"></div>
    </div>

    <div id="info-panel">
      <div id="info-name">地域をクリック</div>
      <div id="info-stats"></div>
    </div>

    <div id="loading-indicator" style="display:none">
      <span>市区町村データ読み込み中...</span>
    </div>
  </div>

  <div id="level-badge">都道府県表示</div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
